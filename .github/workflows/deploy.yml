name: Deploy React App

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (root)
        run: npm ci

      - name: Install deployment dependencies
        run: npm ci
        working-directory: deployment

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          cd deployment
          npx cdk deploy --require-approval never

      - name: Deploy Preview (PR branch)
        if: github.event_name == 'pull_request'
        env:
          ENVIRONMENT: pr-${{ github.event.pull_request.number }}
        run: |
          cd deployment
          npx cdk deploy --require-approval never -c environment=${ENVIRONMENT} | tee ../cdk-deploy-output.txt

      # - name: Comment PR with Deploy Preview Output
      #   if: github.event_name == 'pull_request'
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const fs = require('fs');
      #       const output = fs.readFileSync('cdk-deploy-output.txt', 'utf8');
      #       github.rest.issues.createComment({
      #         issue_number: context.payload.pull_request.number,
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         body: `🚀 **CDK Deploy Output:**\n\n\n\`\`\`\n${output}\n\`\`\``
      #       })

      - name: Output CloudFront URL
        if: always()
        run: cat cdk-deploy-output.txt
